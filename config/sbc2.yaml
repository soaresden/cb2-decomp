name: SBC2.BIN (Cool Boarders 2, PAL)
sha1: 6263d653c21af28b2e9d495fc8aa2a8a1ba66d30
options:
  basename: sbc2
  target_path: iso/SBC2.BIN
  base_path: ..
  platform: psx
  compiler: PSYQ
  asm_path: asm/sbc2
  asset_path: assets/sbc2
  src_path: src/sbc2
  build_path: build
  ld_script_path: linker/sbc2.ld
  symbol_addrs_path: config/symbols.sbc2.txt
  undefined_funcs_auto_path: linker/undefined_funcs_auto.sbc2.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.sbc2.txt
  find_file_boundaries: yes
  use_legacy_include_asm: no
  section_order: [".rodata", ".text", ".data", ".bss"]
  migrate_rodata_to_functions: no
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  ld_bss_is_noload: yes
  subalign: 4
  ld_align_segment_vram_end: no
  ld_align_section_vram_end: no
segments:
  - name: sbc2
    type: code
    start: 0x0
    vram: 0x8005AEA8
    subsegments:
      - [0x0, rodata]
      - [0x4, asm]
      - [0x32318, data]
  - [0x40F00]
