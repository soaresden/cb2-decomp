name: INIT.BIN (Cool Boarders 2, PAL)
sha1: 37da1c724c9903676d32741dbc77bf898b269de6
options:
  basename: init
  target_path: iso/INIT.BIN
  base_path: ..
  platform: psx
  compiler: PSYQ
  asm_path: asm/init
  asset_path: assets/init
  src_path: src/init
  build_path: build
  ld_script_path: linker/init.ld
  symbol_addrs_path: config/symbols.init.txt
  undefined_funcs_auto_path: linker/undefined_funcs_auto.init.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.init.txt
  find_file_boundaries: yes
  use_legacy_include_asm: no
  section_order: [".rodata", ".text", ".data", ".bss"]
  migrate_rodata_to_functions: no
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  ld_bss_is_noload: yes
  subalign: 4
  ld_align_segment_vram_end: no
  ld_align_section_vram_end: no
segments:
  - name: init
    type: code
    start: 0x0
    vram: 0x8005AEA8
    subsegments:
      - [0x0, rodata]
      - [0x4, asm]
      - [0x20FC, data]
  - [0x4D30]
