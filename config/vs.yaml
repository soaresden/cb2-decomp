name: VS.BIN (Cool Boarders 2, PAL)
sha1: 9fdbba5c5d76b60b320103d8a4013d072cbaf4f3
options:
  basename: vs
  target_path: iso/VS.BIN
  base_path: ..
  platform: psx
  compiler: PSYQ
  asm_path: asm/vs
  asset_path: assets/vs
  src_path: src/vs
  build_path: build
  ld_script_path: linker/vs.ld
  symbol_addrs_path: config/symbols.vs.txt
  undefined_funcs_auto_path: linker/undefined_funcs_auto.vs.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.vs.txt
  find_file_boundaries: yes
  use_legacy_include_asm: no
  section_order: [".rodata", ".text", ".data", ".bss"]
  migrate_rodata_to_functions: no
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  ld_bss_is_noload: yes
  subalign: 4
  ld_align_segment_vram_end: no
  ld_align_section_vram_end: no
segments:
  - name: vs
    type: code
    start: 0x0
    vram: 0x8005AEA8
    subsegments:
      - [0x0, rodata]
      - [0x4, asm]
      - [0x3AEB4, data]
  - [0x48BC0]
